<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1400 900">


<defs>


<linearGradient id="bg"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%"
stop-color="#050507"/>

<stop offset="100%"
stop-color="#1c1c22"/>

</linearGradient>



<filter id="blur">

<feGaussianBlur
stdDeviation="30"/>

</filter>


</defs>



<rect width="1400"
height="900"
fill="url(#bg)"/>



<!-- Ambient glow -->

<circle cx="300"
cy="200"
r="250"
fill="#a6e3a1"
opacity=".08"
filter="url(#blur)"/>



<foreignObject
x="0"
y="0"
width="1400"
height="900">


<div xmlns="http://www.w3.org/1999/xhtml">


<style>


body {

margin:0;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
sans-serif;

color:white;

}



.container {

padding:50px;

}



.header {

display:flex;

justify-content:space-between;

align-items:center;

}



.logo {

font-size:60px;

font-weight:700;

letter-spacing:-3px;

color:#a6e3a1;

}



.search {


background:
rgba(255,255,255,.12);


border:none;

border-radius:18px;

padding:15px 25px;

width:300px;

color:white;

font-size:18px;


}



.hero {


margin-top:40px;

height:220px;

border-radius:35px;

background:
linear-gradient(
135deg,
#a6e3a1,
#74c69d
);


padding:40px;

color:#111;


}



.hero h1 {

font-size:45px;

}



.categories {


display:flex;

gap:15px;

margin-top:35px;

}



.category {


background:
rgba(255,255,255,.1);


padding:12px 25px;

border-radius:30px;

cursor:pointer;


}




.games {


display:grid;

grid-template-columns:
repeat(4,1fr);

gap:20px;

margin-top:40px;


}




.card {


background:
rgba(255,255,255,.08);


border-radius:25px;

padding:20px;

height:150px;


transition:.2s;


}



.card:hover {


transform:
translateY(-8px);


background:
rgba(255,255,255,.15);


}



.play {


margin-top:20px;

background:#a6e3a1;

border:none;

padding:10px 25px;

border-radius:15px;

font-weight:bold;

cursor:pointer;


}



</style>




<div class="container">



<div class="header">


<div class="logo">

Scalio

</div>



<input class="search"
id="search"
placeholder="Search games..."
oninput="filter()"/>


</div>




<div class="hero">


<h1>

Play anything.

</h1>


<p>

Hundreds of games powered by SVG.

</p>


</div>




<div class="categories">

<div class="category">
All
</div>

<div class="category">
Arcade
</div>

<div class="category">
Action
</div>

<div class="category">
Sports
</div>

<div class="category">
Horror
</div>

</div>




<div id="games"
class="games">

Loading...

</div>




</div>





<script><![CDATA[


let games=[];


const URL =
"https://raw.githubusercontent.com/CowGoMoo357/htmlgamesrepos/main/games.json";




fetch(URL)

.then(r=>r.json())

.then(data=>{


games=data.games;


render(games);


});





function render(list){


let box =
document.getElementById("games");


box.innerHTML="";



list.forEach(game=>{


let card =
document.createElement("div");


card.className="card";



card.innerHTML=`

<h2>
${game.name}
</h2>

<p>
${game.category||"Game"}
</p>

<button class="play">
Play
</button>

`;



card.querySelector("button")
.onclick=()=>{


fetch(game.url)

.then(r=>r.text())

.then(html=>{


window.open(

"data:text/html;charset=utf-8,"
+
encodeURIComponent(html)

);


});


};



box.appendChild(card);


});


}




function filter(){


let q =
search.value.toLowerCase();



render(

games.filter(
g=>
g.name
.toLowerCase()
.includes(q)

)

);


}



]]></script>



</div>


</foreignObject>


</svg>
