<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 1400 900">

<defs>

<linearGradient id="bg"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%" stop-color="#050507"/>
<stop offset="100%" stop-color="#1e1e2e"/>

</linearGradient>


<filter id="glow">

<feGaussianBlur stdDeviation="35"/>

</filter>

</defs>


<rect width="1400"
height="900"
fill="url(#bg)"/>



<circle
cx="300"
cy="200"
r="250"
fill="#a6e3a1"
opacity=".1"
filter="url(#glow)"/>



<foreignObject
x="0"
y="0"
width="1400"
height="900">


<div xmlns="http://www.w3.org/1999/xhtml">


<style>


* {

box-sizing:border-box;

}


body {

margin:0;

font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
sans-serif;

color:#f5f5f7;

}



.container {

padding:55px;

}



.header {

display:flex;

justify-content:space-between;

align-items:center;

}



.logo {

font-size:70px;

font-weight:700;

letter-spacing:-5px;

color:#a6e3a1;

}



.subtitle {

color:#cdd6f4;

opacity:.7;

font-size:18px;

}



.search {


width:350px;


padding:16px 22px;


border-radius:20px;


border:none;


outline:none;


background:

rgba(255,255,255,.12);


backdrop-filter:

blur(20px);


color:white;


font-size:18px;


}



.hero {


margin-top:45px;


height:230px;


border-radius:35px;


padding:40px;


background:


linear-gradient(

135deg,

#a6e3a1,

#74c69d

);


color:#11111b;


}



.hero h1 {

font-size:50px;

margin:0;

letter-spacing:-2px;

}



.hero p {

font-size:20px;

}



.categories {


display:flex;


gap:15px;


margin-top:35px;


}



.category {


background:


rgba(255,255,255,.12);


border:


1px solid rgba(255,255,255,.15);


color:#f5f5f7;


padding:

12px 28px;


border-radius:30px;


font-weight:600;


cursor:pointer;


transition:.2s;


backdrop-filter:

blur(20px);


}



.category:hover {


background:

rgba(166,227,161,.3);


transform:

translateY(-4px);


}



.category.active {


background:#a6e3a1;


color:#11111b;


}



.games {


margin-top:40px;


display:grid;


grid-template-columns:

repeat(4,1fr);


gap:20px;


}



.card {


background:

rgba(255,255,255,.08);


border:

1px solid rgba(255,255,255,.1);


border-radius:25px;


padding:25px;


height:170px;


color:#f5f5f7;


transition:.25s;


backdrop-filter:

blur(20px);


}



.card:hover {


transform:

translateY(-8px);


background:

rgba(255,255,255,.15);


}



.card h2 {


margin:0;


color:#ffffff;


font-size:22px;


}



.card p {


color:#cdd6f4;


}



.play {


margin-top:15px;


padding:10px 25px;


border:none;


border-radius:15px;


background:#a6e3a1;


color:#11111b;


font-weight:700;


cursor:pointer;


}


</style>





<div class="container">


<div class="header">


<div>


<div class="logo">

Scalio

</div>


<div class="subtitle">

SVG Powered Game Arcade

</div>


</div>



<input

class="search"

id="search"

placeholder="Search games..."

oninput="filterGames()"/>


</div>





<div class="hero">


<h1>

Play anything.

</h1>


<p>

A beautiful game library powered by SVG.

</p>


</div>





<div class="categories">


<div class="category active">

All

</div>


<div class="category">

Arcade

</div>


<div class="category">

Action

</div>


<div class="category">

Sports

</div>


<div class="category">

Horror

</div>


</div>





<div id="games"
class="games">

Loading games...

</div>




</div>





<script><![CDATA[


let games=[];


const gamesURL =

"https://raw.githubusercontent.com/CowGoMoo357/htmlgamesrepos/main/games.json";




fetch(gamesURL)

.then(r=>r.json())

.then(data=>{


games=data.games;


render(games);


});





function render(list){


const box =
document.getElementById("games");


box.innerHTML="";



list.forEach(game=>{


let card =
document.createElement("div");


card.className="card";



card.innerHTML=

`

<h2>${game.name}</h2>

<p>${game.category || "Game"}</p>

<button class="play">

Play

</button>

`;



card.querySelector(".play")
.onclick=()=>{


fetch(game.url)

.then(r=>r.text())

.then(code=>{


let tab =
window.open();


tab.document.write(code);


});


};



box.appendChild(card);


});


}





function filterGames(){


let q =
document
.getElementById("search")
.value
.toLowerCase();



render(

games.filter(

g=>

g.name
.toLowerCase()
.includes(q)

)

);


}



]]></script>


</div>


</foreignObject>


</svg>
